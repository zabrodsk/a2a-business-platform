name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        dockerfile: [Dockerfile.legacy, Dockerfile.registry]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f "${{ matrix.dockerfile }}" -t hackathon-demo:ci .
