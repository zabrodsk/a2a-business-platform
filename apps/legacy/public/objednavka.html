.p7 a.tlink:hover{color:var(--gold);border-color:var(--gold)}
.p7 a.tlink.ink{color:var(--ink);border-color:rgba(18,18,17,.5)}
.btn-lux,.p7 a.btn-lux{border-radius:0;min-height:52px;padding:14px 30px;text-transform:uppercase;letter-spacing:.2em;font:600 12.5px/1 var(--sans);background:#F6F5F1;color:#000;border:1px solid #F6F5F1;text-decoration:none;display:inline-flex;align-items:center;gap:12px}
.p7 a.btn-lux:hover,.btn-lux:hover{background:var(--gold);border-color:var(--gold);color:#000}
.btn-lux.ghost,.p7 a.btn-lux.ghost{background:transparent;color:#F6F5F1;border-color:rgba(246,245,241,.6)}
.imgslot{position:relative;overflow:hidden;background:#0B0B0C;display:flex;align-items:center;justify-content:center}
.imgslot::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 55% 60%,rgba(196,154,108,.28),rgba(0,0,0,0) 70%)}
.imgslot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.imgslot .lab{position:relative;font:500 11.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(196,154,108,.75);border:1px solid rgba(196,154,108,.35);padding:8px 14px;text-align:center}
.shade-b{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 50%,rgba(0,0,0,.75) 100%);pointer-events:none}
.luxseg{display:flex;flex-wrap:wrap;gap:0;border:1px solid rgba(246,245,241,.25)}
.luxseg button{flex:1 1 auto;min-height:52px;padding:10px 18px;border:0;border-right:1px solid rgba(246,245,241,.18);background:none;color:#CDCBC6;font:600 12px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.luxseg button:last-child{border-right:0}
.luxseg button.on{background:#F6F5F1;color:#000}

/* hero photo slot (Main) */
.hphoto{position:absolute;top:0;right:0;bottom:0;width:68%;background:#0B0B0C;overflow:hidden}
.hphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0A0A0B 0%,rgba(10,10,11,.8) 16%,rgba(10,10,11,0) 46%),linear-gradient(180deg,rgba(10,10,11,.55) 0%,rgba(10,10,11,0) 18%),linear-gradient(0deg,#0A0A0B 0%,rgba(10,10,11,0) 30%)}
.hphoto .lab{position:absolute;right:48px;top:50%;transform:translateY(-50%);z-index:1;font:500 11.5px/1.5 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:rgba(196,154,108,.8);border:1px solid rgba(196,154,108,.4);padding:8px 14px;max-width:340px;text-align:center}
@media (max-width:900px){.hphoto{width:100%;opacity:.45}}
